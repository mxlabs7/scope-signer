[package]
name = "scope-signer"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
scope-protocol = { path = "../protocol" }
scope-solana = { path = "../solana" }
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
ciborium = "0.2.2"
p256 = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
hkdf = "0.13.0"
hmac = "0.13.0"
sha1 = "0.11.0"
sha2 = "0.11.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
redb = "4.3.0"
zeroize = { version = "1.9.0", features = ["derive"] }
anyhow = "1.0.104"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
tempfile = "3"
scope-pump = { path = "../pump" }

[lints]
workspace = true
